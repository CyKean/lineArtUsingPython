<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background-color: black;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        canvas {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        canvas.loaded {
            opacity: 1;
        }
        
        @media (orientation: portrait) {
            canvas {
                width: 100%;
                height: auto;
            }
        }
        
        @media (orientation: landscape) {
            canvas {
                height: 100vh;
                width: auto;
            }
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 50px;
            transition: opacity 0.5s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .heartbeat {
            stroke: white;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 2s linear infinite;
        }

        @keyframes dash {
            0% {
                stroke-dashoffset: 1000;
            }
            15% {
                stroke-dashoffset: 900;
            }
            25% {
                stroke-dashoffset: 800;
            }
            30% {
                stroke-dashoffset: 400;
            }
            35% {
                stroke-dashoffset: 200;
            }
            40% {
                stroke-dashoffset: 0;
            }
            100% {
                stroke-dashoffset: 0;
            }
        }
    </style>
</head>
<body>
    <canvas id="artCanvas"></canvas>
    <div id="loading">
        <svg viewBox="0 0 100 50">
            <path class="heartbeat" d="M 0,25 L 20,25 L 25,10 L 30,40 L 35,25 L 40,25 L 45,20 L 50,30 L 55,25 L 60,25 L 65,10 L 70,40 L 75,25 L 100,25" />
        </svg>
    </div>

    <script>
       // Add this to your fetch request
        fetch('/process_image', {
            method: 'POST'
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            if (data.error) {
                showError(data.error);
                return;
            }
            // ... rest of your code
        })
        .catch(error => {
            showError(error.message);
        });

        function showError(message) {
            const loading = document.getElementById('loading');
            loading.innerHTML = `<div class="error">${message}</div>`;
            loading.classList.remove('hidden');
        }
    </script>
</body>
</html>
